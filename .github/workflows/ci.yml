name: CI

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go tests and runtime smoke checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Verify modules
        run: go mod verify

      - name: Check formatting
        run: |
          files="$(gofmt -s -l .)"
          if [ -n "$files" ]; then
            echo "Formatting issues found:"
            echo "$files"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test with coverage
        run: go test ./... -count=1 -timeout 180s -coverprofile=coverage.txt -covermode=atomic

      - name: Build
        run: go build ./cmd/paradox

      - name: Smoke test the scientific slice
        run: |
          go run ./cmd/paradox run --provider mock --mode paradox \
            --runs-dir "$RUNNER_TEMP/runs" --json > "$RUNNER_TEMP/run.json"

      - name: Smoke test matched evaluation
        run: |
          go run ./cmd/paradox eval --provider mock --suite science \
            --modes baseline,evidence,paradox --trials 1 \
            --runs-dir "$RUNNER_TEMP/runs" --output "$RUNNER_TEMP/evals" \
            --markdown "$RUNNER_TEMP/report.md" --json > "$RUNNER_TEMP/report.json"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paradox-diagnostics
          if-no-files-found: ignore
          path: |
            coverage.txt
            ${{ runner.temp }}/run.json
            ${{ runner.temp }}/report.json
            ${{ runner.temp }}/report.md

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Check vulnerabilities
        run: govulncheck ./...
